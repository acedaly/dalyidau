<!doctype html>
<html lang="en-AU">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <!-- Wedding Planner installs as an app (worker/portal/pwa.ts). The manifest is behind Cloudflare Access, so it's fetched with credentials. -->
        <link rel="manifest" href="/portal/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="apple-touch-icon" href="/icons/wedding-planner-apple-180.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Wedding" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <!-- Sets the dark-mode class before first paint to avoid a flash. -->
        <script src="/theme-init.js"></script>
        <!--app-head-->
        <script type="module" src="/src/entry-portal.tsx"></script>
    </head>
    <body class="min-h-dvh bg-primary antialiased">
        <div id="root"><!--app-html--></div>
        <!--app-data-->
    </body>
</html>
