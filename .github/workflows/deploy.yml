name: Deploy

# Production deploys on every push to main once tests pass. Staging deploys on demand.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOYMENT.md).

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                type: choice
                options: [production, staging]
                default: production

concurrency:
    group: deploy-${{ github.event.inputs.environment || 'production' }}
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e

    deploy:
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: ${{ github.event.inputs.environment || 'production' }}
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            WRANGLER_ENV: ${{ github.event.inputs.environment == 'staging' && 'staging' || '' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Check Cloudflare credentials
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
                    echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/DEPLOYMENT.md)."
                    exit 1
                  fi
            - run: npm run build:client
            - name: Apply D1 migrations
              run: npx wrangler d1 migrations apply DB --remote --env="$WRANGLER_ENV"
            - name: Deploy Worker
              run: npx wrangler deploy --env="$WRANGLER_ENV" --message "${{ github.sha }}"
