name: Deploy

# Production deploys on every push to main once tests pass, or on demand. Production is the only
# environment (the staging environment was removed).
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOYMENT.md).

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run check:styles
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e

    deploy:
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Check Cloudflare credentials
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
                    echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/DEPLOYMENT.md)."
                    exit 1
                  fi
            - run: npm run build:client
            - name: Configuration safety
              run: node scripts/check-config.mjs --env production --offline
            # D1 Time Travel can restore the database to any minute in the last 30 days. Logging the
            # bookmark here records exactly where to go back to if this deploy's migrations go wrong
            # (docs/DATABASE.md). It contains no data.
            - name: Record database restore point
              run: npx wrangler d1 time-travel info DB --env=""
            - name: Apply D1 migrations
              run: npx wrangler d1 migrations apply DB --remote --env=""
            - name: Verify database after migrating (read-only)
              run: node scripts/db-verify.mjs --env production
            - name: Deploy Worker
              run: npx wrangler deploy --env="" --message "${{ github.sha }}"
