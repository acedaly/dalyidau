name: CI

on:
    pull_request:
    push:
        branches-ignore: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - name: Unit and integration tests (workerd, local D1/R2)
              run: npm test
            - name: Bundle check
              run: npx wrangler deploy --dry-run --outdir dist/worker --env=""
            - name: Client bundle guard (no portal code in the blog, no secrets anywhere)
              run: npm run check:bundle
            - name: Untitled UI semantic token guard
              run: npm run check:styles
            - name: Configuration safety (production and staging, config file only)
              run: node scripts/check-config.mjs --offline && node scripts/check-config.mjs --env staging --offline
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: End-to-end tests
              run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: test-results
                  retention-days: 7
